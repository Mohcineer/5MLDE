[project]
name = "tp01-steam"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas==2.2.3",
  "numpy==2.2.6",
  "scikit-learn==1.6.1",
  "joblib==1.5.1",
  "matplotlib==3.10.3",
  "jupyterlab==4.4.3",
  "ipykernel==6.29.5",
  "httpx>=0.28.1",
  "fastapi>=0.162.0",
  "uvicorn>=0.54.0",
  "great-expectations==1.23.2",
  "mlflow>=3.17.2",
]

[dependency-groups]
dev = ["pytest==8.3.5", "nbformat==5.10.4", "nbclient==0.10.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
